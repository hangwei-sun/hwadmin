[package]
name = "hwadmin-desktop"
version = "1.6.6"
description = "HwAdmin desktop client"
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
