# Include inside the vhost whose document root contains the extracted release.
location = / {
    rewrite ^ /admin/index.html last;
}
location ^~ /admin/ {
    try_files $uri $uri/ /admin/index.html;
}
location = /admin/hwadmin.config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
}
# 保留 /adminapi/ 与其他静态路由规则至 HwAdmin 后端服务。
