name: HwAdmin Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.6.5)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Unified Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 PHP 运行环境与扩展
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, mbstring, json, curl, zip, gd, intl, bcmath
          tools: composer:v2

      - name: 安装后端生产依赖 (Composer --no-dev)
        run: |
          cd server
          composer validate --strict
          composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: 设置 Node.js 运行时
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: 构建并同步前端产物至 server/public/admin
        run: |
          cd admin-ui
          pnpm install --frozen-lockfile
          pnpm vue-tsc --noEmit
          pnpm build:sync

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 打包统一发行 ZIP 与 SHA256 校验文件
        id: pack
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            RAW_VER="${{ inputs.version }}"
          else
            RAW_VER="${GITHUB_REF_NAME}"
          fi
          if [[ "$RAW_VER" != v* ]]; then
            RAW_VER="v${RAW_VER}"
          fi
          echo "version=${RAW_VER}" >> "$GITHUB_OUTPUT"

          python3 scripts/build-release.py --mode=unified --version "${RAW_VER}"
          ZIP_FILE="release/hwadmin-${RAW_VER}.zip"
          SHA_FILE="release/hwadmin-${RAW_VER}.zip.sha256"
          test -f "${ZIP_FILE}"
          test -f "${SHA_FILE}"

          (cd release && sha256sum -c "hwadmin-${RAW_VER}.zip.sha256")
          echo "zip_file=${ZIP_FILE}" >> "$GITHUB_OUTPUT"
          echo "sha_file=${SHA_FILE}" >> "$GITHUB_OUTPUT"

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.version }}
          name: HwAdmin ${{ steps.pack.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.pack.outputs.zip_file }}
            ${{ steps.pack.outputs.sha_file }}

      - name: 上传构建产物 (手动触发时保留)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: hwadmin-${{ steps.pack.outputs.version }}
          path: |
            ${{ steps.pack.outputs.zip_file }}
            ${{ steps.pack.outputs.sha_file }}
