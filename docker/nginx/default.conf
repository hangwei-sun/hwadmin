# HwAdmin container HTTP origin; put behind a TLS terminating proxy in production.
server {
    listen 80;
    server_name localhost;
    root /var/www/hwadmin/server/public;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 500M;
    server_tokens off;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/json application/javascript font/woff2 font/ttf image/svg+xml;

    location ~* ^/(uploads|plugins)/.*\.(php\d*|phtml|phar|sh|cgi|pl|py|asp|aspx|jsp|html?|svg)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(sql|bak|inc|old|env|sqlite|zip)$ { return 404; }
    location = /admin/index.html {
        try_files $uri /index.php?s=/index/Index/entry/entry/admin;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }
    location ~* ^/admin/static/ {
        try_files $uri =404;
        expires 1y;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /admin { absolute_redirect off; return 301 /admin/; }
    location /admin/ {
        try_files $uri /index.php?s=/index/Index/entry/entry/admin;
    }
    location /uploads/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }
    location /plugins/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.php?s=$uri&$args; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass hwadmin-php:9000;
        fastcgi_read_timeout 300;
    }
    location ~* \.php { return 404; }
}
